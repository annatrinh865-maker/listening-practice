<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f3ea">
<title>聽力練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6f4f'/%3E%3Cpath d='M20 16v32M30 16v32M40 16v32' stroke='%23f7f3ea' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ==== 10-style.css ==== */
:root {
  --paper: #f7f3ea;
  --card: #ffffff;
  --ink: #22201c;
  --ink2: #6b6558;
  --line: #e2dbcc;
  --accent: #2f6f4f;
  --accent-soft: #e4efe6;
  --warn: #b4552d;
  --bad: #b3261e;
  --good: #2f6f4f;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  overscroll-behavior: none;
}
#app { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }

/* ---------- generic chrome ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-t) + 14px) 16px 12px;
  background: var(--paper);
  position: sticky; top: 0; z-index: 5;
}
.topbar h1 { font-size: 19px; margin: 0; flex: 1; font-weight: 800; letter-spacing: .02em; }
.topbar .sub { font-size: 12px; color: var(--ink2); font-weight: 500; }
.iconbtn {
  width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; background: #fff; border: 1px solid var(--line); color: var(--ink);
}
.pad { padding: 0 16px; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-b) + 24px); }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.tiny { font-size: 11px; }
.center { text-align: center; }

.btn {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  width: 100%; padding: 15px 16px; border-radius: 14px;
  background: #fff; border: 1px solid var(--line);
  font-size: 16px; font-weight: 700;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; }
.btn .ic { font-size: 19px; }
.btncol { display: grid; gap: 10px; }

/* ---------- home ---------- */
.hero { padding: 6px 16px 18px; }
.hero .big { font-size: 27px; font-weight: 900; letter-spacing: -.01em; line-height: 1.25; }
.hero p { margin: 8px 0 0; color: var(--ink2); font-size: 14px; }
.setcard {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 15px 16px; margin: 0 16px 12px; display: block; width: calc(100% - 32px); text-align: left;
  box-shadow: 0 1px 0 rgba(0,0,0,.02);
}
.setcard .nm { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.setcard .meta { font-size: 12.5px; color: var(--ink2); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
.pill.good { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: #f7e7dd; color: var(--warn); }
.pill.grey { background: #eee9dd; color: var(--ink2); }
.bar { height: 6px; border-radius: 99px; background: #ece6d8; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.empty { margin: 40px 24px; text-align: center; color: var(--ink2); font-size: 14px; line-height: 1.8; }
.fabwrap { position: sticky; bottom: 0; padding: 12px 16px calc(var(--safe-b) + 14px); background: linear-gradient(to top, var(--paper) 65%, rgba(247,243,234,0)); }

/* ---------- set hub ---------- */
.hubhead { padding: 0 16px 14px; }
.hubhead .nm { font-size: 24px; font-weight: 900; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 4px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-weight: 900; }
.stat span { font-size: 11px; color: var(--ink2); }
.menu { display: grid; gap: 10px; padding: 16px; }
.menu .btn { justify-content: flex-start; padding: 16px; }
.menu .btn .lbl { flex: 1; text-align: left; }
.menu .btn .lbl small { display: block; font-weight: 500; font-size: 12px; color: var(--ink2); }
.menu .btn.primary .lbl small { color: rgba(255,255,255,.8); }
.menu .btn .chev { color: var(--ink2); font-size: 15px; }
.menu .btn.primary .chev { color: rgba(255,255,255,.8); }

/* ---------- quiz ---------- */
.qwrap { flex: 1; display: flex; flex-direction: column; padding: 4px 16px calc(var(--safe-b) + 14px); }
.qhead { display: flex; align-items: baseline; gap: 10px; }
.qno { font-size: 40px; font-weight: 900; letter-spacing: -.02em; line-height: 1; }
.qno small { font-size: 14px; font-weight: 700; color: var(--ink2); letter-spacing: 0; }
.qhint { font-size: 12.5px; color: var(--ink2); margin-left: auto; }
.optcol { display: grid; gap: 10px; margin-top: 22px; }
.opt {
  display: flex; align-items: center; gap: 13px; width: 100%;
  padding: 17px 16px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line);
  font-size: 20px; font-weight: 800; text-align: left;
  transition: transform .08s, background .15s, border-color .15s;
}
.opt:active { transform: scale(.985); }
.opt .ch {
  width: 34px; height: 34px; flex: none; border-radius: 10px; background: #f0ece1;
  display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 900;
}
.opt.on { background: var(--accent-soft); border-color: var(--accent); }
.opt.on .ch { background: var(--accent); color: #fff; }
.opt.right { background: var(--accent-soft); border-color: var(--accent); }
.opt.right .ch { background: var(--accent); color: #fff; }
.opt.wrong { background: #fbeceb; border-color: var(--bad); }
.opt.wrong .ch { background: var(--bad); color: #fff; }
.opt .tag { margin-left: auto; font-size: 12px; font-weight: 800; }
.optgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.opt.big {
  justify-content: center; padding: 0; min-height: 92px; font-size: 34px; font-weight: 900;
  letter-spacing: .02em;
}
.peek { margin-top: auto; padding-top: 18px; }
.peek-lbl { font-size: 11.5px; color: var(--ink2); font-weight: 700; margin-bottom: 8px; letter-spacing: .04em; }
.peekrow { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.peekrow::-webkit-scrollbar { display: none; }
.peekth {
  flex: none; width: 76px; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden;
  border: 2px solid transparent; background: #fff; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.peekth.on { border-color: var(--accent); }
.peekth img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 文字題 */
.qtext { margin-top: 14px; font-size: 20px; line-height: 1.5; font-weight: 700; letter-spacing: .01em; }
.zhtext { margin-top: 9px; font-size: 15px; font-weight: 500; color: var(--ink2); line-height: 1.65; }
.chipbtn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 700; color: var(--ink2); }
.chipbtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.optlist { display: grid; gap: 10px; margin-top: 16px; }
.optrow {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px;
  border-radius: 13px; background: #fff; border: 1.5px solid var(--line);
  text-align: left; font-size: 16.5px; line-height: 1.45; font-weight: 600;
}
.optrow:active { transform: scale(.99); }
.optrow .ch { width: 28px; height: 28px; flex: none; border-radius: 8px; background: #f0ece1; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; }
.optrow .txt { flex: 1; }
.optrow.on { background: var(--accent-soft); border-color: var(--accent); }
.optrow.on .ch { background: var(--accent); color: #fff; }
.qwrap .navrow { margin-top: auto; }
.dq { font-size: 16.5px; line-height: 1.55; font-weight: 700; margin-bottom: 10px; }
.dopts { display: grid; gap: 6px; }
.dopt { display: flex; gap: 9px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; padding: 7px 9px; border-radius: 9px; }
.dopt .ch { width: 22px; height: 22px; flex: none; border-radius: 6px; background: #f0ece1; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 900; }
.dopt .txt { flex: 1; }
.dopt.right { background: var(--accent-soft); }
.dopt.right .ch { background: var(--accent); color: #fff; }
.dopt.wrong { background: #fbeceb; }
.dopt.wrong .ch { background: var(--bad); color: #fff; }
.dopt .tag { font-size: 11px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.audiohint { margin-top: auto; display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px dashed #d8d0be; border-radius: 14px; padding: 15px; }
.audiohint .ah-ic { font-size: 22px; line-height: 1.2; }
.audiohint b { display: block; font-size: 15px; font-weight: 800; }
.audiohint span { display: block; font-size: 12.5px; color: var(--ink2); line-height: 1.55; margin-top: 4px; }
.qwrap .optgrid { margin-bottom: auto; }
.navrow { display: flex; gap: 10px; margin-top: 0; padding-top: 16px; }
.navrow .btn { padding: 14px; }

/* ---------- grade ---------- */
.score { text-align: center; padding: 18px 16px 8px; }
.score .big { font-size: 56px; font-weight: 900; line-height: 1; letter-spacing: -.03em; }
.score .big small { font-size: 20px; color: var(--ink2); font-weight: 800; }
.score .txt { color: var(--ink2); font-size: 13.5px; margin-top: 8px; }
.seg { display: flex; gap: 6px; background: #ece6d8; padding: 4px; border-radius: 12px; margin: 14px 16px; }
.seg button { flex: 1; padding: 9px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.grow {
  display: flex; align-items: center; gap: 12px; padding: 13px 16px; margin: 0 16px 8px;
  background: #fff; border: 1px solid var(--line); border-radius: 13px; width: calc(100% - 32px); text-align: left;
}
.grow .n { font-size: 15px; font-weight: 900; width: 34px; flex: none; }
.grow .ab { font-size: 13px; color: var(--ink2); }
.grow .ab b { font-size: 15px; }
.grow .mark { margin-left: auto; font-size: 18px; }
.grow.ok .mark { color: var(--good); }
.grow.ng .mark { color: var(--bad); }
.grow .pend { font-size: 12px; color: var(--warn); }

/* ---------- detail / notes ---------- */
.detail { padding: 0 16px calc(var(--safe-b) + 24px); }
.dcard { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 15px; margin-bottom: 12px; }
.dcard h3 { margin: 0 0 8px; font-size: 13px; color: var(--ink2); font-weight: 700; letter-spacing: .04em; }
.kv { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
.chip { display: inline-flex; width: 32px; height: 32px; border-radius: 9px; align-items: center; justify-content: center; font-weight: 900; background: #f0ece1; }
.chip.good { background: var(--accent-soft); color: var(--accent); }
.chip.bad { background: #fbeceb; color: var(--bad); }
textarea.notes {
  width: 100%; min-height: 120px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
  background: #fdfcf8; resize: vertical; font-size: 15px; line-height: 1.7;
}

/* ---------- reader ---------- */
.reader { position: fixed; inset: 0; background: #161512; display: flex; flex-direction: column; z-index: 40; }
.reader .rbar {
  display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 10px) 12px 10px;
  color: #efe9dc; font-size: 13px;
}
.reader .rbar .btn2 { background: rgba(255,255,255,.1); color: #efe9dc; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
.reader .stage { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.reader .stage img { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; user-select: none; -webkit-user-drag: none; }
.reader .rfoot { display: flex; align-items: center; gap: 8px; padding: 10px 12px calc(var(--safe-b) + 10px); }
.reader .rfoot .btn2 { flex: none; background: rgba(255,255,255,.1); color: #efe9dc; border-radius: 11px; padding: 11px 14px; font-size: 14px; font-weight: 700; }
.reader .rfoot .seg2 { flex: 1; display: flex; gap: 4px; background: rgba(255,255,255,.08); padding: 4px; border-radius: 11px; }
.reader .rfoot .seg2 button { flex: 1; color: #efe9dc; font-size: 12.5px; font-weight: 700; padding: 7px 4px; border-radius: 8px; }
.reader .rfoot .seg2 button.on { background: rgba(255,255,255,.9); color: #161512; }
.reader .rfoot .btn2:disabled { opacity: .3; }

/* ---------- sheet ---------- */
.sheetback { position: fixed; inset: 0; background: rgba(20,18,14,.45); z-index: 60; display: flex; align-items: flex-end; }
.sheet {
  width: 100%; background: var(--paper); border-radius: 20px 20px 0 0; padding: 16px 16px calc(var(--safe-b) + 16px);
  max-height: 78vh; display: flex; flex-direction: column; animation: up .18s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
.sheet h2 { margin: 0 0 12px; font-size: 16px; font-weight: 800; }
.jump { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; overflow-y: auto; padding-bottom: 4px; }
.jump button { aspect-ratio: 1; border-radius: 11px; background: #fff; border: 1px solid var(--line); font-weight: 800; font-size: 14px; }
.jump button.done { background: var(--accent-soft); border-color: #bcd6c4; color: var(--accent); }
.jump button.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.jump button.ok { background: var(--accent); color: #fff; border-color: var(--accent); }
.jump button.ng { background: #fbeceb; color: var(--bad); border-color: #eec3bf; }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
.field input[type=text], .field input[type=number] {
  width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 16px;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.thumbs .th { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; aspect-ratio: 3/4; }
.thumbs .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs .th .x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.thumbs .th .n { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 10px; text-align: center; padding: 1px; }
.pickzone {
  border: 1.5px dashed #cfc6b2; border-radius: var(--r); padding: 26px 16px; text-align: center;
  background: #fffdf8; color: var(--ink2); font-size: 14px; margin-bottom: 14px;
}
.pickzone .ic { font-size: 26px; display: block; margin-bottom: 6px; }
.pickzone b { color: var(--accent); }

.kindrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.kindbtn { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 6px; font-size: 12.5px; font-weight: 800; line-height: 1.35; color: var(--ink2); }
.kindbtn .k-ic { display: block; font-size: 20px; margin-bottom: 5px; }
.kindbtn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ---------- 掃描框選 ---------- */
.crop { position: fixed; inset: 0; background: #14130f; display: flex; flex-direction: column; z-index: 45; }
.crop .cbar { display: flex; align-items: center; gap: 8px; padding: calc(var(--safe-t) + 10px) 12px 8px; color: #efe9dc; font-size: 12.5px; }
.crop .cbar .btn2 { background: rgba(255,255,255,.1); color: #efe9dc; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
.cropstage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; }
.cropwrap { position: relative; line-height: 0; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
.cropwrap img { width: 100%; height: 100%; display: block; }
.cropwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cropwrap .quad { fill: rgba(70,190,120,.14); stroke: #6fe3a3; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.cropwrap .h { fill: #6fe3a3; stroke: #10231a; stroke-width: 3; vector-effect: non-scaling-stroke; touch-action: none; cursor: grab; }
.crop .cfoot { display: flex; align-items: center; gap: 8px; padding: 10px 12px calc(var(--safe-b) + 12px); }
.crop .cfoot .seg2 { flex: 1; display: flex; gap: 4px; background: rgba(255,255,255,.08); padding: 4px; border-radius: 11px; }
.crop .cfoot .seg2 button { flex: 1; color: #efe9dc; font-size: 12.5px; font-weight: 700; padding: 8px 4px; border-radius: 8px; }
.crop .cfoot .seg2 button.on { background: rgba(255,255,255,.9); color: #14130f; }
.crop .cfoot .btn2 { background: #6fe3a3; color: #10231a; border-radius: 11px; padding: 12px 16px; font-size: 14px; font-weight: 800; }
.crop .cfoot .btn2.strong { background: #6fe3a3; }

#toast {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 62px); transform: translate(-50%, -10px);
  background: #22201c; color: #fff; font-size: 13.5px; font-weight: 600; padding: 10px 16px;
  border-radius: 999px; opacity: 0; pointer-events: none; transition: .18s; z-index: 90; white-space: nowrap;
  max-width: 86vw; overflow: hidden; text-overflow: ellipsis;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

</style>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('app');
  if (el && !el.dataset.rendered) {
    el.innerHTML = '<div style="padding:24px;font:14px/1.7 system-ui;color:#b3261e">載入失敗：' + (e.message || '不明錯誤') + '</div>';
  }
});
</script>
</head>
<body>
<div id="app"></div>

/* ===== 20-store.js — 資料層 ===== */
const LETTERS = ['A', 'B', 'C', 'D'];
const DB_NAME = 'lp-db';
const DB_VER = 1;
let _db = null;

function openDB() {
  return new Promise((res, rej) => {
    if (_db) return res(_db);
    if (!window.indexedDB) return rej(new Error('這個瀏覽器不支援離線儲存'));
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('sets')) d.createObjectStore('sets', { keyPath: 'id' });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function dbAll() {
  const d = await openDB();
  return new Promise((res, rej) => {
    const req = d.transaction('sets', 'readonly').objectStore('sets').getAll();
    req.onsuccess = () => res((req.result || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
    req.onerror = () => rej(req.error);
  });
}
async function dbGet(id) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const req = d.transaction('sets', 'readonly').objectStore('sets').get(id);
    req.onsuccess = () => res(req.result || null);
    req.onerror = () => rej(req.error);
  });
}
async function dbPut(s) {
  const d = await openDB();
  s.updatedAt = Date.now();
  return new Promise((res, rej) => {
    const req = d.transaction('sets', 'readwrite').objectStore('sets').put(s);
    req.onsuccess = () => res(true);
    req.onerror = () => rej(req.error);
  });
}
async function dbDel(id) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const req = d.transaction('sets', 'readwrite').objectStore('sets').delete(id);
    req.onsuccess = () => res(true);
    req.onerror = () => rej(req.error);
  });
}

/* 內建題組（由 build.py 把 bank/*.json 注入成 BANK） */
function builtinSet() {
  if (typeof BANK === 'undefined' || !BANK || !BANK.questions) return null;
  const pages = BANK.pages.map(p => ({ id: uid(), url: p.url, qFrom: p.qFrom, qTo: p.qTo, role: 'key' }));
  const key = {};
  Object.keys(BANK.questions).forEach(n => {
    const q = BANK.questions[n];
    if (q && q.k) key[n] = q.k;
  });
  return {
    id: BANK.id, name: BANK.name, builtin: true,
    createdAt: Date.now(), updatedAt: Date.now(),
    qFrom: BANK.qFrom, qTo: BANK.qTo,
    pages, questions: BANK.questions, key,
    answers: {}, notes: {}, lastScore: null
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function qlist(set) {
  const out = [];
  for (let n = set.qFrom; n <= set.qTo; n++) out.push(n);
  return out;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* 圖片壓縮：長邊上限 2200px、JPEG 0.85，一張約 300–600KB */
async function compressFile(file) {
  const bitmap = await (async () => {
    if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch (e) { /* fall through */ } }
    return await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error('這張圖片讀不進來'));
      img.src = URL.createObjectURL(file);
    });
  })();
  const w0 = bitmap.width, h0 = bitmap.height;
  const MAX = 2200;
  const k = Math.min(1, MAX / Math.max(w0, h0));
  const w = Math.round(w0 * k), h = Math.round(h0 * k);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(bitmap, 0, 0, w, h);
  const url = cv.toDataURL('image/jpeg', 0.85);
  return { id: uid(), url, w, h, bytes: Math.round(url.length * 0.75) };
}

}

  if (!S.set) return;

  const pages = (s.pages && s.pages.length) || s.pageCount || 0;

    return `<button class="setcard" data-act="open" data-id="${s.id}">

      <div class="meta"><span>${pages} 頁</span><span>可以放大讀、可匯出 PDF</span></div>

  }
  const list = qlist(s), total = list.length;
  const ans = list.filter(n => s.answers[n]).length;
  const keyed = list.filter(n => s.key[n]).length;
  const ls = s.lastScore;
  const pct = total ? Math.round(ans / total * 100) : 0;
  const pill = ls
    ? `<span class="pill ${ls.ok / ls.keyed >= 0.8 ? 'good' : 'warn'}">上次 ${ls.ok}/${ls.keyed}</span>`

/* ---------- 批改 ---------- */
function gradeOf(st) {
  const list = qlist(st);
  let ok = 0, keyed = 0, ans = 0;
  list.forEach(n => {
    if (st.key[n]) keyed++;
    if (st.answers[n]) ans++;
    if (st.key[n] && st.answers[n] === st.key[n]) ok++;
  });
  return { ok, keyed, ans, total: list.length };
}

function viewGrade() {
  const st = S.set, list = qlist(st), g = gradeOf(st);
  const pct = g.keyed ? Math.round(g.ok / g.keyed * 100) : 0;
  const rows = list.filter(n => {
    if (S.filter === 'wrong') return !(st.key[n] && st.answers[n] === st.key[n]);
    return true;
  });
  return `
  <div class="topbar">
    <button class="iconbtn" data-act="backSet">‹</button>
    <h1>批改結果</h1>
  </div>
  <div class="scroll">

      <div class="txt">答對 ${g.ok} 題 / 正解已設定 ${g.keyed} 題　·　答了 ${g.ans} 題</div>
      ${g.keyed < g.total ? `<div class="small" style="color:var(--warn);margin-top:8px">還有 ${g.total - g.keyed} 題沒設定正解，不會列入計分。<button style="text-decoration:underline;font-weight:800;color:var(--warn)" data-act="keys">去設定</button></div>` : ''}

/* ---------- 閱讀器：縮放 / 拖曳 ---------- */
const R = { W: 0, H: 0, Hc: 0 };
function readerFit(img) {
  const stage = img.parentElement;
  R.W = stage.clientWidth;
  R.Hc = stage.clientHeight;
  R.H = img.naturalHeight * (R.W / img.naturalWidth);
  img.style.width = R.W + 'px';
  img.style.height = 'auto';
}
function applyTransform() {
  const img = document.getElementById('rimg');
  if (!img || !R.W) return;
  const st = S.reader;
  const cw = R.W * st.s, ch = R.H * st.s;
  const minTx = Math.min(0, R.W - cw), minTy = Math.min(0, R.Hc - ch);
  st.tx = Math.max(minTx, Math.min(0, st.tx));
  st.ty = Math.max(minTy, Math.min(0, st.ty));
  img.style.transform = `translate(${st.tx}px,${st.ty}px) scale(${st.s})`;
  img.style.filter = `brightness(${st.bright}%) contrast(${st.contrast}%)`;
}
function setCol(col) {
  const st = S.reader;
  st.col = col;
  if (col === 'full') { st.s = 1; st.tx = 0; st.ty = 0; }
  else { st.s = 2; st.tx = col === 'left' ? 0 : -R.W; st.ty = 0; }
  applyTransform();
  document.querySelectorAll('.seg2 button').forEach(b => b.classList.toggle('on', b.dataset.v === col));
}
function bindReaderGestures() {
  const stage = document.querySelector('.reader .stage');
  const img = document.getElementById('rimg');
  if (!stage || !img) return;
  const ptrs = new Map();
  let pinchBase = 0, lastDist = 0, lastTap = 0, moved = false;

  const dist = () => {
    const [a, b] = [...ptrs.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };
  const mid = () => {
    const [a, b] = [...ptrs.values()];
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  };
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = false;
    if (ptrs.size === 2) { lastDist = dist(); pinchBase = S.reader.s; }
  });
  stage.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size >= 2) {
      const d = dist();
      if (lastDist > 0 && d > 0) {
        const rect = stage.getBoundingClientRect();
        const m = mid();
        const fx = m.x - rect.left, fy = m.y - rect.top;
        const ratio = d / lastDist;
        const ns = Math.max(1, Math.min(6, S.reader.s * ratio));
        const realRatio = ns / S.reader.s;
        S.reader.tx = fx - (fx - S.reader.tx) * realRatio;
        S.reader.ty = fy - (fy - S.reader.ty) * realRatio;
        S.reader.s = ns;
      }
      lastDist = d;
    } else if (S.reader.s > 1) {
      S.reader.tx += dx; S.reader.ty += dy;
    }
    applyTransform();
  });
  const end = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) lastDist = 0;
    if (ptrs.size === 0 && !moved) {
      const now = Date.now();
      if (now - lastTap < 320) {
        const rect = stage.getBoundingClientRect();
        const fx = e.clientX - rect.left, fy = e.clientY - rect.top;
        if (S.reader.s > 1.2) { S.reader.s = 1; S.reader.tx = 0; S.reader.ty = 0; }
        else {
          const ns = 2.6, k = ns / S.reader.s;
          S.reader.s = ns;
          S.reader.tx = fx - fx * k; S.reader.ty = fy - fy * k;
        }
        applyTransform();
        lastTap = 0;
      } else lastTap = now;
    }
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  // 桌機方便：滾輪縮放
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const fx = e.clientX - rect.left, fy = e.clientY - rect.top;
    const ns = Math.max(1, Math.min(6, S.reader.s * (e.deltaY < 0 ? 1.12 : 0.89)));
    const k = ns / S.reader.s;
    S.reader.tx = fx - (fx - S.reader.tx) * k;
    S.reader.ty = fy - (fy - S.reader.ty) * k;
    S.reader.s = ns;
    applyTransform();
  }, { passive: false });
}

/* ---------- 選圖 / 建檔 ---------- */
async function handleFiles(files, appendToSet, role) {
  const arr = [...(files || [])];
  if (!arr.length) return;
  const isScan = appendToSet ? (S.set && S.set.kind === 'scan') : S.imp.kind === 'scan';
  const mode = S.imp.mode || 'gray';

  // 掃描：先壓縮，再進框選畫面（四角拉正 → 去陰影）
  if (isScan) {
    const queue = [];
    S.imp.busy = true;
    for (let i = 0; i < arr.length; i++) {
      S.imp.note = `讀取 ${i + 1} / ${arr.length}…`;
      if (!appendToSet) render();
      try { queue.push(await compressFile(arr[i])); } catch (e) { /* 壞圖跳過 */ }
    }
    S.imp.busy = false;
    S.imp.note = '';
    if (!queue.length) { render(); return; }
    CROP = null;
    await openCrop(queue, appendToSet ? 'set' : 'import');
    return;
  }

  if (appendToSet) {
    S.imp.busy = true;
    for (let i = 0; i < arr.length; i++) {
      try {
        const p = await compressFile(arr[i]);
        p.role = role || 'book';
        S.set.pages.push(p);
      } catch (e) { toast('有圖片讀不進來'); }
    }
    save();
    S.imp.busy = false;
    render();
    toast('已加入 ' + arr.length + ' 頁');
    return;
  }

  S.imp.busy = true;
  for (let i = 0; i < arr.length; i++) {
    S.imp.note = `處理中 ${i + 1} / ${arr.length}…`;
    render();
    try {
      const p = await compressFile(arr[i]);
      S.imp.pages.push(p);
    } catch (e) { /* 跳過壞圖 */ }
  }
  S.imp.busy = false;
  S.imp.note = '';
  render();
}

      S.overlay = 'reader'; render(); break;

/* ==== 45-crop.js ==== */
/* ===== 45-crop.js — 掃描框選（四角可拖） ===== */
let CROP = null;

async function openCrop(queue, target) {
  CROP = { queue, idx: 0, target, filter: (S.imp.mode === 'bw' ? 'bw' : 'gray'), imgW: 0, imgH: 0, corners: null, busy: false };
  await loadCropStep();
}

async function loadCropStep() {
  const p = CROP.queue[CROP.idx];
  const im = await loadImage(p.url);
  CROP.imgW = im.naturalWidth;
  CROP.imgH = im.naturalHeight;
  CROP.corners = detectCorners(canvasOf(im));
  S.screen = 'crop';
  render();
}

function cropPolyPoints() {
  return CROP.corners.map(p => `${p[0]},${p[1]}`).join(' ');
}

function cropHTML() {
  const c = CROP;
  if (!c || !c.imgW) return `<div class="crop"><div class="cbar">處理中…</div></div>`;
  const r = Math.max(16, Math.round(c.imgW / 34));
  return `<div class="crop">
    <div class="cbar">
      <button class="btn2" data-act="cropCancel">✕ 取消</button>
      <div style="flex:1;text-align:center">第 ${c.idx + 1} / ${c.queue.length} 張 · 拉四個角對齊紙張</div>
      <button class="btn2" data-act="cropAuto">自動</button>
    </div>
    <div class="cropstage" id="cstage">
      <div class="cropwrap" id="cwrap">
        <img id="cimg" src="${c.queue[c.idx].url}" alt="">
        <svg id="csvg" viewBox="0 0 ${c.imgW} ${c.imgH}" preserveAspectRatio="none">
          <polygon class="quad" points="${cropPolyPoints()}"></polygon>
          ${c.corners.map((pt, i) => `<circle class="h" data-i="${i}" cx="${pt[0]}" cy="${pt[1]}" r="${r}"></circle>`).join('')}
        </svg>
      </div>
    </div>
    <div class="cfoot">
      <div class="seg2">
        <button data-act="cropFilter" data-v="color" class="${c.filter === 'color' ? 'on' : ''}">彩色</button>
        <button data-act="cropFilter" data-v="gray" class="${c.filter === 'gray' ? 'on' : ''}">灰階</button>
        <button data-act="cropFilter" data-v="bw" class="${c.filter === 'bw' ? 'on' : ''}">黑白</button>
      </div>
      <button class="btn2 strong" data-act="cropApply">${c.idx + 1 === c.queue.length ? '完成' : '下一張 ›'}</button>
    </div>
  </div>`;
}

/* 尺寸：把圖縮到放得進畫面，回報 scale */
function sizeCrop() {
  const stage = document.getElementById('cstage');
  const wrap = document.getElementById('cwrap');
  if (!stage || !wrap || !CROP) return;
  const pad = 8;
  const sw = stage.clientWidth - pad * 2;
  const sh = stage.clientHeight - pad * 2;
  const k = Math.min(sw / CROP.imgW, sh / CROP.imgH);
  wrap.style.width = Math.round(CROP.imgW * k) + 'px';
  wrap.style.height = Math.round(CROP.imgH * k) + 'px';
}

function bindCrop() {
  if (!CROP) return;
  sizeCrop();
  window.onresize = () => { if (S.screen === 'crop') sizeCrop(); };
  const svg = document.getElementById('csvg');
  const poly = svg && svg.querySelector('.quad');
  if (!svg) return;
  let dragIdx = -1;

  const toImg = e => {
    const r = svg.getBoundingClientRect();
    return [
      (e.clientX - r.left) / r.width * CROP.imgW,
      (e.clientY - r.top) / r.height * CROP.imgH
    ];
  };
  svg.querySelectorAll('circle.h').forEach(cir => {
    cir.addEventListener('pointerdown', e => {
      e.preventDefault();
      dragIdx = +cir.dataset.i;
      cir.setPointerCapture(e.pointerId);
    });
    cir.addEventListener('pointermove', e => {
      if (dragIdx !== +cir.dataset.i) return;
      const [x, y] = toImg(e);
      const cx = Math.max(0, Math.min(CROP.imgW, x));
      const cy = Math.max(0, Math.min(CROP.imgH, y));
      CROP.corners[+cir.dataset.i] = [Math.round(cx), Math.round(cy)];
      cir.setAttribute('cx', cx);
      cir.setAttribute('cy', cy);
      if (poly) poly.setAttribute('points', cropPolyPoints());
    });
    cir.addEventListener('pointerup', e => { dragIdx = -1; });
    cir.addEventListener('pointercancel', () => { dragIdx = -1; });
  });
}

async function cropApply() {
  if (!CROP || CROP.busy) return;
  CROP.busy = true;
  toast('處理中…');
  try {
    const p = CROP.queue[CROP.idx];
    const out = await scanPage(p.url, CROP.corners, CROP.filter);
    const page = { id: uid(), url: out.url, w: out.w, h: out.h, role: 'scan' };
    if (CROP.target === 'set' && S.set) { S.set.pages.push(page); save(); }
    else S.imp.pages.push(page);
  } catch (e) {
    toast('這張處理失敗');
  }
  CROP.busy = false;
  CROP.idx++;
  if (CROP.idx >= CROP.queue.length) finishCrop();
  else await loadCropStep();
}

function finishCrop() {
  const target = CROP ? CROP.target : 'import';
  CROP = null;
  window.onresize = null;
  if (target === 'set') { S.screen = 'set'; render(); }
  else { S.screen = 'import'; render(); }
}

/* ==== 50-scan.js ==== */
/* ===== 50-scan.js — 掃描：找頁面四角 → 透視拉正 → 去陰影/白底 ===== */

function canvasOf(img) {
  const cv = document.createElement('canvas');
  cv.width = img.naturalWidth || img.width;
  cv.height = img.naturalHeight || img.height;
  cv.getContext('2d').drawImage(img, 0, 0);
  return cv;
}
function loadImage(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('圖片讀不進來'));
    im.src = url;
  });
}

/* ---- 1. 找文件四角（Otsu → 最大亮區 → 極值四點） ---- */
function detectCorners(cv) {
  const W = cv.width, H = cv.height;
  const SW = 260;
  const SH = Math.max(1, Math.round(H * SW / W));
  const sc = document.createElement('canvas');
  sc.width = SW; sc.height = SH;
  const sx = sc.getContext('2d');
  sx.drawImage(cv, 0, 0, SW, SH);
  const d = sx.getImageData(0, 0, SW, SH).data;

  const N = SW * SH;
  const g = new Uint8Array(N);
  const hist = new Array(256).fill(0);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    g[p] = v; hist[v]++;
  }
  // Otsu
  let sum = 0;
  for (let v = 0; v < 256; v++) sum += v * hist[v];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for (let v = 0; v < 256; v++) {
    wB += hist[v];
    if (!wB) continue;
    const wF = N - wB;
    if (!wF) break;
    sumB += v * hist[v];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best) { best = between; thr = v; }
  }

  // 最大連通亮區
  const seen = new Uint8Array(N);
  const stack = new Int32Array(N);
  let bestPixels = null, bestCount = 0;
  for (let start = 0; start < N; start++) {
    if (seen[start] || g[start] <= thr) continue;
    let top = 0, count = 0;
    const list = [];
    stack[top++] = start; seen[start] = 1;
    while (top) {
      const cur = stack[--top];
      list.push(cur); count++;
      const x = cur % SW, y = (cur / SW) | 0;
      if (x > 0 && !seen[cur - 1] && g[cur - 1] > thr) { seen[cur - 1] = 1; stack[top++] = cur - 1; }
      if (x < SW - 1 && !seen[cur + 1] && g[cur + 1] > thr) { seen[cur + 1] = 1; stack[top++] = cur + 1; }
      if (y > 0 && !seen[cur - SW] && g[cur - SW] > thr) { seen[cur - SW] = 1; stack[top++] = cur - SW; }
      if (y < SH - 1 && !seen[cur + SW] && g[cur + SW] > thr) { seen[cur + SW] = 1; stack[top++] = cur + SW; }
    }
    if (count > bestCount) { bestCount = count; bestPixels = list; }
  }

  const fallback = [[0, 0], [W, 0], [W, H], [0, H]];
  if (!bestPixels || bestCount < N * 0.18) return fallback;

  let minS = 1e9, maxS = -1e9, minD = 1e9, maxD = -1e9;
  // 用「最極端的一小群點的平均」當角點，避免單一雜點把角拉歪
  const k = Math.max(6, Math.floor(bestPixels.length * 0.004));
  const pick = (metric, dir) => {
    const arr = [];
    for (let i = 0; i < bestPixels.length; i++) {
      const idx = bestPixels[i];
      const x = idx % SW, y = (idx / SW) | 0;
      const v = dir * metric(x, y);
      if (arr.length < k) { arr.push([v, x, y]); if (arr.length === k) arr.sort((a, b) => a[0] - b[0]); }
      else if (v < arr[k - 1][0]) { arr[k - 1] = [v, x, y]; arr.sort((a, b) => a[0] - b[0]); }
    }
    if (!arr.length) return null;
    let sx = 0, sy = 0;
    for (const p of arr) { sx += p[1]; sy += p[2]; }
    return [sx / arr.length, sy / arr.length];
  };
  const TL = pick((x, y) => x + y, 1);
  const BR = pick((x, y) => x + y, -1);
  const TR = pick((x, y) => x - y, -1);
  const BL = pick((x, y) => x - y, 1);
  if (!TL || !TR || !BR || !BL) return fallback;
  const kx = W / SW, ky = H / SH;
  const pts = [TL, TR, BR, BL].map(p => [Math.round(p[0] * kx), Math.round(p[1] * ky)]);
  // 面積太小 → 用整張
  const area = Math.abs(
    (pts[0][0] * pts[1][1] - pts[1][0] * pts[0][1]) + (pts[1][0] * pts[2][1] - pts[2][0] * pts[1][1]) +
    (pts[2][0] * pts[3][1] - pts[3][0] * pts[2][1]) + (pts[3][0] * pts[0][1] - pts[0][0] * pts[3][1])
  ) / 2;
  if (area < W * H * 0.2) return fallback;
  // 往外放 1.5%：自動偵測容易往內縮，寧可多留一點白邊也不要切到字
  const cx0 = (pts[0][0] + pts[1][0] + pts[2][0] + pts[3][0]) / 4;
  const cy0 = (pts[0][1] + pts[1][1] + pts[2][1] + pts[3][1]) / 4;
  const grow = 1.015;
  return pts.map(p => [
    Math.max(0, Math.min(W, Math.round(cx0 + (p[0] - cx0) * grow))),
    Math.max(0, Math.min(H, Math.round(cy0 + (p[1] - cy0) * grow)))
  ]);
}

/* ---- 2. 透視校正（四邊形 → 矩形） ---- */
function solve8(A, b) {
  const n = 8;
  for (let i = 0; i < n; i++) {
    let piv = i;
    for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[piv][i])) piv = r;
    if (Math.abs(A[piv][i]) < 1e-9) return null;
    if (piv !== i) { const t = A[i]; A[i] = A[piv]; A[piv] = t; const tb = b[i]; b[i] = b[piv]; b[piv] = tb; }
    for (let r = 0; r < n; r++) {
      if (r === i) continue;
      const f = A[r][i] / A[i][i];
      if (!f) continue;
      for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n);
  for (let i = 0; i < n; i++) x[i] = b[i] / A[i][i];
  return x;
}

function warpPerspective(srcCv, corners, maxSide) {
  const [p0, p1, p2, p3] = corners;
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let outW = Math.round(Math.max(dist(p0, p1), dist(p3, p2)));
  let outH = Math.round(Math.max(dist(p0, p3), dist(p1, p2)));
  const cap = maxSide || 2200;
  const k = Math.min(1, cap / Math.max(outW, outH));
  outW = Math.max(80, Math.round(outW * k));
  outH = Math.max(80, Math.round(outH * k));

  const dst = [[0, 0], [outW, 0], [outW, outH], [0, outH]];
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [u, v] = dst[i], [x, y] = [p0, p1, p2, p3][i];
    A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); b.push(x);
    A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); b.push(y);
  }
  const h = solve8(A, b);
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  const ox = out.getContext('2d');
  if (!h) { ox.drawImage(srcCv, 0, 0, outW, outH); return out; }

  const sctx = srcCv.getContext('2d');
  const sd = sctx.getImageData(0, 0, srcCv.width, srcCv.height).data;
  const SW = srcCv.width, SH = srcCv.height;
  const dstImg = ox.createImageData(outW, outH);
  const od = dstImg.data;

  for (let v = 0; v < outH; v++) {
    const rowBase = v * outW * 4;
    for (let u = 0; u < outW; u++) {
      const den = h[6] * u + h[7] * v + 1;
      const sxf = (h[0] * u + h[1] * v + h[2]) / den;
      const syf = (h[3] * u + h[4] * v + h[5]) / den;
      const di = rowBase + u * 4;
      if (sxf < 0 || syf < 0 || sxf >= SW - 1 || syf >= SH - 1) {
        od[di] = od[di + 1] = od[di + 2] = 255; od[di + 3] = 255;
        continue;
      }
      const x0 = sxf | 0, y0 = syf | 0;
      const fx = sxf - x0, fy = syf - y0;
      const i00 = (y0 * SW + x0) * 4, i10 = i00 + 4;
      const i01 = i00 + SW * 4, i11 = i01 + 4;
      for (let c = 0; c < 3; c++) {
        od[di + c] =
          sd[i00 + c] * (1 - fx) * (1 - fy) + sd[i10 + c] * fx * (1 - fy) +
          sd[i01 + c] * (1 - fx) * fy + sd[i11 + c] * fx * fy;
      }
      od[di + 3] = 255;
    }
  }
  ox.putImageData(dstImg, 0, 0);
  return out;
}

/* ---- 3. 去陰影 / 白底 / 二值化 ---- */
function enhanceCanvas(cv, mode) {
  if (!mode || mode === 'color') return cv;
  const cx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const img = cx.getImageData(0, 0, W, H);
  const a = img.data;
  const n = W * H;

  const L = new Float32Array(n);
  for (let i = 0, p = 0; i < a.length; i += 4, p++) {
    L[p] = a[i] * 0.299 + a[i + 1] * 0.587 + a[i + 2] * 0.114;
  }

  const W1 = W + 1;
  const S1 = new Float64Array((n) + W1 * 2);
  const S2 = new Float64Array((n) + W1 * 2);
  for (let y = 0; y < H; y++) {
    let rs = 0, rq = 0;
    const rowBase = (y + 1) * W1, prevBase = y * W1;
    for (let x = 0; x < W; x++) {
      const v = L[y * W + x];
      rs += v; rq += v * v;
      S1[rowBase + x + 1] = S1[prevBase + x + 1] + rs;
      S2[rowBase + x + 1] = S2[prevBase + x + 1] + rq;
    }
  }
  const rect = (S, x0, y0, x1, y1) => S[y1 * W1 + x1] - S[y0 * W1 + x1] - S[y1 * W1 + x0] + S[y0 * W1 + x0];

  const r = Math.max(10, Math.round(W / 24));
  const k = 0.2, R = 128;
  const out = new Uint8ClampedArray(n);

  for (let y = 0; y < H; y++) {
    const y0 = y - r < 0 ? 0 : y - r;
    const y1 = y + r + 1 > H ? H : y + r + 1;
    for (let x = 0; x < W; x++) {
      const x0 = x - r < 0 ? 0 : x - r;
      const x1 = x + r + 1 > W ? W : x + r + 1;
      const cnt = (x1 - x0) * (y1 - y0);
      const mean = rect(S1, x0, y0, x1, y1) / cnt;
      const v = L[y * W + x];
      let gv;
      if (mode === 'bw') {
        const sq = rect(S2, x0, y0, x1, y1);
        const std = Math.sqrt(Math.max(0, sq / cnt - mean * mean));
        const T = mean * (1 + k * (std / R - 1));
        gv = v > T ? 255 : 0;
      } else {
        gv = mean > 4 ? (v / mean) * 244 : v;
        if (gv > 226) gv = 255;
        if (gv < 3) gv = 0;
      }
      out[y * W + x] = gv;
    }
  }

  for (let i = 0, p = 0; i < a.length; i += 4, p++) {
    a[i] = a[i + 1] = a[i + 2] = out[p];
    a[i + 3] = 255;
  }
  cx.putImageData(img, 0, 0);
  return cv;
}

/* 一步完成：拉正 + 增強，回傳 dataURL */
async function scanPage(url, corners, mode) {
  const im = await loadImage(url);
  const src = canvasOf(im);
  const warped = warpPerspective(src, corners || detectCorners(src), 2200);
  enhanceCanvas(warped, mode);
  return { url: warped.toDataURL('image/jpeg', 0.85), w: warped.width, h: warped.height };
}

/* ---- 4. 匯出 PDF（用瀏覽器列印 → 存成 PDF） ---- */
function exportPDF(set) {
  const w = window.open('', '_blank');
  if (!w) return toast('請允許彈出視窗才能匯出');
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(set.name)}</title>
  <style>
    @page { size: A4; margin: 0; }
    html, body { margin: 0; padding: 0; background: #fff; }
    img { width: 100%; display: block; page-break-after: always; break-after: page; }
    img:last-child { page-break-after: auto; }
  </style></head><body>
  ${set.pages.map(p => `<img src="${p.url}" alt="">`).join('')}
  <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 500); };<\/script>
  </body></html>`;
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* ==== 90-boot.js ==== */
/* ===== 90-boot.js — 啟動 ===== */
(async function boot() {
  try {
    const all = await dbAll();
    S.sets = all.map(s => ({ ...s, pageCount: (s.pages || []).length, pages: [] }));
  } catch (e) {
    S.sets = [];
    setTimeout(() => toast('這個瀏覽器無法離線儲存，重新整理後資料會消失'), 400);
  }
  // 第一次打開：把內建題組放進去
  if (!S.sets.some(s => s.builtin)) {
    try {
      const b = builtinSet();
      if (b) {
        await dbPut(b);
        S.sets.unshift({ ...b, pageCount: b.pages.length, pages: [] });
      }
    } catch (e) { /* 沒有內建資料就照常開 */ }
  }
  S.screen = 'home';
  render();
})();
